[tool.poetry]
authors = ["David Andersson <anderssonpublic@gmail.com>"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
  "Natural Language :: English",
  "Topic :: Database",
  "Topic :: Database :: Front-Ends",
  "Topic :: Internet",
  "Typing :: Typed",
]
description = "Maps an OpenAPI schema to SQLAlchemy models."
documentation = "https://openapi-sqlalchemy.readthedocs.io/en/latest/index.html"
exclude = ["docs", "examples", "tests"]
homepage = "https://github.com/jdkandersson/OpenAlchemy"
include = ["open_alchemy", "*.json", "*.j2"]
keywords = ["OpenAPI", "SQLAlchemy", "Python", "models", "database"]
license = "Apache-2.0"
name = "OpenAlchemy"
packages = [
  {include = "open_alchemy"},
]
readme = "README.md"
repository = "https://github.com/jdkandersson/OpenAlchemy"
version = "2.5.0"

[tool.poetry.scripts]
openalchemy = "open_alchemy.cli:main"

[tool.poetry.dependencies]
Jinja2 = "^3"
SQLAlchemy = "^2.0"
jsonschema = "^4"
python = "^3.9"
setuptools = {version = "^75", optional = true}
wheel = {version = "^0.44", optional = true}
PyYAML = {version = "^6", optional = true}

[tool.poetry.extras]
wheel = ["setuptools", "wheel"]
yaml = ["PyYAML"]

[tool.poetry.group.dev.dependencies]
Flask-SQLAlchemy = "^3"
Sphinx = "^7"
alembic = "^1"
bandit = "^1"
black = "^24"
connexion = {version = "^2.15", extras = ["swagger-ui"]}
doc8 = "^1"
flake8 = "^7"
furo = "^2024"
isort = "^5"
mypy = "^1"
myst-parser = "^2"
pre-commit = "^3"
pydocstyle = "^6"
pylint = "^3"
pytest = "^8"
pytest-cov = "^5"
pytest-flask = "^1"
pytest-flask-sqlalchemy = "^1"
pytest-randomly = "^3"
rstcheck = "^6"
sphinx-autobuild = "^2024"
sphinx-copybutton = "^0.5"
sqlalchemy_mixins = "^2"
typeguard = "^4"
types-jsonschema = "^4"
types-PyYAML = "^6"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]
